[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-driven-backtester"
version = "0.1.0"
description = "A small event-driven backtester: MARKET -> SIGNAL -> ORDER -> FILL through one central queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "yfinance>=0.2.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
