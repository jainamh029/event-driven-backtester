name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Report builds from committed data
        run: python scripts/build_report.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS engine matches Python engine
        run: node scripts/check_js_parity.mjs
